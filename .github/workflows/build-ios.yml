name: iOS Build Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.swift'
      - '**/*.xcodeproj/**'
      - '**/*.xcworkspace/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Find Xcode project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(find . -name '*.xcworkspace' -not -path '*/.build/*' -not -path '*/Pods/*' | head -n 1 || true)
          project=$(find . -name '*.xcodeproj' -not -path '*/Pods/*' | head -n 1 || true)
          if [[ -n "$workspace" ]]; then
            echo "kind=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$workspace" >> "$GITHUB_OUTPUT"
          elif [[ -n "$project" ]]; then
            echo "kind=project" >> "$GITHUB_OUTPUT"
            echo "path=$project" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No Xcode workspace or project found."
            exit 1
          fi
      - name: List schemes
        shell: bash
        run: |
          if [[ "${{ steps.project.outputs.kind }}" == "workspace" ]]; then
            xcodebuild -list -workspace "${{ steps.project.outputs.path }}"
          else
            xcodebuild -list -project "${{ steps.project.outputs.path }}"
          fi
      - name: Build for iOS Simulator without signing
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.project.outputs.kind }}" == "workspace" ]]; then
            target=(-workspace "${{ steps.project.outputs.path }}")
          else
            target=(-project "${{ steps.project.outputs.path }}")
          fi
          xcodebuild -list "${target[@]}"
          scheme=$(xcodebuild -list -json "${target[@]}" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("workspace") or d.get("project") or {}).get("schemes", [""])[0])')
          if [[ -z "$scheme" ]]; then
            echo "::error::No shared Xcode scheme found. Share a scheme in Xcode to enable CI builds."
            exit 1
          fi
          echo "Building scheme: $scheme"
          xcodebuild "${target[@]}" -scheme "$scheme" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
